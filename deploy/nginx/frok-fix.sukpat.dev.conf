# FrokFix° — Streamlit หลัง nginx
# วางที่ /etc/nginx/sites-available/frok-fix.sukpat.dev แล้ว symlink ไป sites-enabled/
# บล็อกนี้เป็น HTTP ล้วน ให้ certbot --nginx เติม 443 กับ redirect ให้เอง

server {
    listen 80;
    listen [::]:80;
    server_name frok-fix.sukpat.dev;

    # ponytail: app เดียว ไม่มี static แยก proxy ทุก path รวด
    location / {
        proxy_pass http://127.0.0.1:8501;

        # Streamlit คุยผ่าน websocket (/_stcore/stream) ขาด 3 บรรทัดนี้แล้วจอขาว
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # websocket ค้างไว้ยาว ถ้าใช้ default 60s แชทจะหลุดทุกนาที
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
