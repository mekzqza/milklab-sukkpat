name: Log Repair Job

# pivot (S4): ร้านนมมี cron ปิดร้านทุกคืนแล้วสรุปยอด แต่ร้านซ่อมรับงานไม่เป็นเวลา
# เลยเหลือแค่ manual dispatch ไว้บันทึกงานจากมือถือตอนอยู่หน้าร้าน
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'รุ่นเครื่อง'
        required: true
        default: 'iPhone 12'
      service:
        description: 'รายการซ่อม'
        required: true
        default: 'เปลี่ยนจอ เกรด A'
      price:
        description: 'ราคา'
        required: true
        default: '1290'
      warranty:
        description: 'ประกัน (วัน)'
        required: true
        default: '15'

jobs:
  log-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run sales_logger
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: |
          python sales_logger.py \
            --model "${{ github.event.inputs.model }}" \
            --service "${{ github.event.inputs.service }}" \
            --price ${{ github.event.inputs.price }} \
            --warranty ${{ github.event.inputs.warranty }}
